# Startvärden från specen. registered_recently och small_employer är antaganden
# som ska testas mot utfallet och tas bort om de inte håller - höj versionen när
# du ändrar något, call_list.scoring_version visar vilken fil som byggde en lista.
#
# Ett block per signal i registret (SIGNALS i scoring.py), varken fler eller
# färre: ett okänt eller saknat namn stoppar inläsningen (D29).
#   enabled: false -> härleds inte alls.
#   weight: 0      -> skuggläge (D26): härleds och sparas per listrad, men ger
#                     inga poäng och visas inte för säljaren.
# advertises_chair och unmet_search_demand är parkerade (D4). De läggs till här
# tillsammans med sin härledningsfunktion när de plockas upp.
version: "v3"
half_life_days: 90
signals:
  registered_recently:
    enabled: true
    weight: 1
    # Registrerad för högst så här många kalendermånader sedan.
    months: 24
  small_employer:
    enabled: true
    weight: 1
    # SCB Storleksklass Anställda: "2" = 1-4 anställda. "0" = uppgift saknas,
    # "1" = 0 anställda. Citattecknen behövs: koderna är text i databasen.
    classes: ["2"]

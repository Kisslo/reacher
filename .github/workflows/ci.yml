name: ci

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Om GitHub varnar att den här action-versionen är utdaterad,
      # höj major-numret. Allt annat i steget är oförändrat.
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # --locked failar om någon ändrat pyproject.toml utan att köra uv add/lock.
      - run: uv sync --locked

      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
